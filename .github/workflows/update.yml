name: Refresh and publish
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Collect league data
        run: |
          python engine/collect.py --out site/data/live.json
          python engine/fetch_raw.py
          python engine/export_plan.py --out site/data/plan.json
          python engine/export_fa.py --out site/data/fa.json
          python engine/export_values.py --out site/data/values.json
          python engine/export_trades.py --out site/data/trades.json
          python engine/crystal_nba.py --runs 20000 --out site/data/crystal.json
          python almanac/build_auto.py --live site/data/live.json --facts site/data/factfile.json --out site/data/auto.json
          python almanac/build_weeks.py --live site/data/live.json --out site/data/weeks_auto.json
          python almanac/export_xlsx.py --data site/data --out site/almanac.xlsx
      - name: Cache-bust the app files
        run: sed -i "s/?v=dev/?v=$(date +%s)/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
